[project]
name = "enterprise-os"
version = "0.1.0"
description = "EnterpriseOS Digital CEO runtime."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]
demo = [
    "requests",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
