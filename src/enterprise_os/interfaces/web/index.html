<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EnterpriseOS CEO Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; }
        h1 { border-bottom: 1px solid #444; padding-bottom: 10px; }
        #log { background: #000; padding: 15px; border-radius: 5px; height: 600px; overflow-y: auto; font-family: monospace; white-space: pre-wrap; }
        .event { margin-bottom: 10px; border-left: 3px solid #555; padding-left: 10px; }
        .type-GoalCreated { border-left-color: #4CAF50; }
        .type-StateTransitioned { border-left-color: #2196F3; }
        .type-StepCompleted { border-left-color: #8BC34A; }
        .type-StepFailed { border-left-color: #F44336; }
        .type-DecisionMade { border-left-color: #FF9800; }
        .type-EvaluationCompleted { border-left-color: #9C27B0; }
        .timestamp { color: #888; font-size: 0.8em; }
        .event-type { font-weight: bold; color: #ddd; }
    </style>
</head>
<body>
    <h1>EnterpriseOS Live Dashboard</h1>
    <div id="log">Waiting for events...</div>
    
    <script>
        const log = document.getElementById('log');
        const ws = new WebSocket(`ws://${window.location.host}/ceo/events/ws`);
        
        ws.onopen = () => { log.innerHTML = ''; addLog('System', 'Connected to EventStreamer'); };
        ws.onclose = () => { addLog('System', 'Disconnected from EventStreamer'); };
        ws.onerror = (err) => { addLog('System', `WebSocket Error: ${err}`); };
        
        ws.onmessage = (msg) => {
            try {
                const event = JSON.parse(msg.data);
                addLog(event.type, JSON.stringify(event.data, null, 2), event.data.timestamp);
            } catch (e) {
                addLog('Raw', msg.data);
            }
        };
        
        function addLog(type, content, timestamp) {
            const el = document.createElement('div');
            el.className = `event type-${type}`;
            const timeStr = timestamp ? new Date(timestamp).toLocaleTimeString() : new Date().toLocaleTimeString();
            el.innerHTML = `<div class="timestamp">[${timeStr}] <span class="event-type">${type}</span></div><div>${content}</div>`;
            log.appendChild(el);
            log.scrollTop = log.scrollHeight;
        }
    </script>
</body>
</html>
